<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>三国风云 - 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;font-size:14px}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:#fff;padding:40px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);width:360px;max-width:90vw}
.login-box h2{text-align:center;margin-bottom:24px;color:#136ec2}
.login-box input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px;font-size:14px}
.login-box button{width:100%;padding:10px;background:#136ec2;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer;margin-top:12px}
.layout{display:flex;min-height:100vh}
.sidebar{width:200px;background:#001529;color:#fff;flex-shrink:0}
.sidebar .logo{padding:20px;font-size:16px;font-weight:bold;text-align:center;border-bottom:1px solid #333}
.sidebar .menu-item{padding:12px 20px;cursor:pointer;color:rgba(255,255,255,.65)}
.sidebar .menu-item:hover,.sidebar .menu-item.active{background:#136ec2;color:#fff}
.topbar{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat-card .num{font-size:24px;font-weight:bold;color:#136ec2;margin-top:8px}
.stat-card .label{color:#999;font-size:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}
th{background:#fafafa;font-weight:600;color:#666}
.btn{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:13px;margin-right:4px}
.btn-primary{background:#136ec2;color:#fff}
.btn-danger{background:#ff4d4f;color:#fff}
.btn-default{background:#fff;border:1px solid #ddd;color:#666}
.search-bar{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.search-bar input{padding:8px;border:1px solid #ddd;border-radius:4px;flex:1;min-width:150px}
.search-bar button{padding:8px 16px;background:#136ec2;color:#fff;border:none;border-radius:4px;cursor:pointer}
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.modal{background:#fff;padding:24px;border-radius:8px;width:420px;max-width:90vw;max-height:80vh;overflow:auto}
.modal h3{margin-bottom:16px}
.modal input,.modal textarea,.modal select{width:100%;padding:8px;margin:6px 0;border:1px solid #ddd;border-radius:4px}
.modal .modal-footer{margin-top:16px;text-align:right}
.tag{padding:2px 8px;border-radius:4px;font-size:12px}
.tag-on{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.tag-vip{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}
@media(max-width:768px){
  .sidebar{width:60px}
  .sidebar .logo{font-size:12px;padding:10px 5px}
  .sidebar .menu-item{padding:12px 5px;text-align:center;font-size:11px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .topbar{padding:10px}
  .card{padding:10px}
}
.err{color:#ff4d4f;padding:20px;text-align:center}
</style>
</head>

    <div class="menu-item active" onclick="showPage('dashboard',this)" data-page="dashboard">仪表盘</div>

    <div class="menu-item" onclick="showPage('sponsor',this)" data-page="sponsor">赞助记录</div>
    <div class="menu-item" onclick="showPage('items',this)" data-page="items">道具管理</div>

<script>

const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkY2tsdWVtem16ZmFuY2FzY2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTc3MzQsImV4cCI6MjEwNzM3MzczNH0.i4cW81Lk6joaaWJKmR_uF4TvBdyRhO9QOOEkIggeLFw';
let _cache={};
let CURRENT_ADMIN='admin';
let CURRENT_PERMS={equip:true,gift:true,boss:true,perm:true,activity:true};
let CURRENT_IS_SUPER=false;
const PERM_KEYS={equip:'装备管理',gift:'礼包管理',boss:'BOSS管理',perm:'权限管理',activity:'活动管理'};
const DEFAULT_PERMS={equip:false,gift:false,boss:false,perm:false,activity:false};

async function api(table,opts={}){
  const cacheKey=table+'?'+(opts.query||'');
  if(opts.method==='GET'&&!opts.noCache&&_cache[cacheKey]&&Date.now()-_cache[cacheKey].t<30000)return _cache[cacheKey].data;
  try{
    const url=new URL(`${SUPABASE_URL}/rest/v1/${table}`);
    if(opts.query)new URLSearchParams(opts.query).forEach((v,k)=>url.searchParams.set(k,v));
    const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};
    if(opts.body)headers['Content-Type']='application/json';
    if(opts.method==='PATCH')headers['Prefer']='return=representation';
    const res=await fetch(url.toString(),{
      method:opts.method||'GET',
      headers:headers,
      body:opts.body?JSON.stringify(opts.body):undefined
    });
    const data=await res.json();
    if(opts.method==='GET'&&Array.isArray(data)&&!opts.noCache)_cache[cacheKey]={t:Date.now(),data};
    return data;
  }catch(e){console.error('API错误:',table,e);alert('接口错误:'+e.message+' 表:'+table);return [];}
}
function parseData(d){if(typeof d==='string'){try{return JSON.parse(d)}catch(e){return {}}}return d||{};}

async function doLogin(){
  const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;
  if(!u||!p){alert('请输入账号和密码');return;}
  let rows;
  try{
    const raw=await fetch(`${SUPABASE_URL}/rest/v1/admin_accounts?select=*&limit=1000`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    if(!raw.ok){
      adminTip('管理员表不存在：请先在 Supabase SQL Editor 执行 init_admin_tables.sql 后再登录');
      return;
    }
    rows=await raw.json();
  }catch(e){adminTip('接口错误:'+e.message);return;}
  if(!Array.isArray(rows))rows=[];
  if(!rows.length){
    // 无管理员账号时，首个进入的账号自动置为超级管理员
    const body={username:u,password:p,is_super:true,perms:{equip:true,gift:true,boss:true,perm:true,activity:true}};
    await api('admin_accounts',{method:'POST',body:body,noCache:true});
    CURRENT_ADMIN=u;CURRENT_IS_SUPER=true;CURRENT_PERMS=Object.assign({},DEFAULT_PERMS,{equip:true,gift:true,boss:true,perm:true,activity:true});
    localStorage.setItem('tmsg_admin','1');
    adminTip('首个账号已自动设为超级管理员');
    enterAdmin();
    return;
  }
  const acc=rows.find(r=>r.username===u);
  if(!acc||acc.password!==p){alert('账号或密码错误');return;}
  CURRENT_ADMIN=u;CURRENT_IS_SUPER=!!acc.is_super;CURRENT_PERMS=Object.assign({},DEFAULT_PERMS,parseData(acc.perms));
  localStorage.setItem('tmsg_admin','1');
  enterAdmin();
}
function enterAdmin(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainPage').style.display='flex';
  const tu=document.getElementById('topUser');if(tu)tu.innerText=CURRENT_ADMIN+(CURRENT_IS_SUPER?'(超管)':'');
  // 按权限过滤侧栏菜单
  document.querySelectorAll('.menu-item[data-perm]').forEach(m=>{
    const pk=m.getAttribute('data-perm');
    const ok=CURRENT_IS_SUPER||CURRENT_PERMS[pk];
    m.style.display=ok?'block':'none';
  });
  showPage('dashboard',document.querySelector('.menu-item[data-page="dashboard"]'));
  ensureAdminSeeds();
}
function doLogout(){localStorage.removeItem('tmsg_admin');location.reload();}

function showPage(name,el){
  document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
  el.classList.add('active');
  const titles={dashboard:'仪表盘',users:'用户管理',sponsor:'赞助记录',items:'道具管理',equip:'装备管理',gift:'礼包管理',boss:'BOSS管理',perm:'权限管理',activities:'活动管理',announce:'公告管理',chat:'聊天监控'};
  document.getElementById('pageTitle').innerText=titles[name];
  const c=document.getElementById('content');
  if(name==='dashboard')renderDashboard(c);
  if(name==='users')renderUsers(c);
  if(name==='sponsor')renderSponsor(c);
  if(name==='items')renderItems(c);
  if(name==='equip')renderEquip(c);
  if(name==='gift')renderGift(c);
  if(name==='boss')renderBoss(c);
  if(name==='perm')renderPerm(c);
  if(name==='activities')renderActivities(c);
  if(name==='announce')renderAnnounce(c);
  if(name==='chat')renderChat(c);
}

async function renderDashboard(c){
  c.innerHTML='<div class="stat-row">'+
    '<div class="stat-card"><div class="label">总玩家数</div><div class="num" id="st1">-</div></div>'+
    '<div class="stat-card"><div class="label">总银两</div><div class="num" id="st2">-</div></div>'+
    '<div class="stat-card"><div class="label">总元宝</div><div class="num" id="st3">-</div></div>'+
    '<div class="stat-card"><div class="label">总金珠</div><div class="num" id="st4">-</div></div>'+
  '</div><div class="card"><h3>最近公告</h3><div id="recentAnnounce">-</div></div>';
  const saves=await api('saves?select=username,data');
  let ts=0,ty=0,tg=0;
  saves.forEach(r=>{const d=parseData(r.data);const ch=d.char||{};ts+=ch.silver||0;ty+=ch.yuanbao||0;tg+=ch.gold||0;});
  document.getElementById('st1').innerText=saves.length;
  document.getElementById('st2').innerText=ts.toLocaleString();
  document.getElementById('st3').innerText=ty.toLocaleString();
  document.getElementById('st4').innerText=tg.toLocaleString();
  const anns=await api('announcements?select=*&order=created_at.desc&limit=5').catch(()=>[]);
  document.getElementById('recentAnnounce').innerHTML=anns.map(a=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${a.title}</b> <span style="color:#999;font-size:12px">${(a.created_at||'').substring(0,16)}</span></div>`).join('')||'暂无公告';
}

async function renderUsers(c){
  c.innerHTML=`<div class="card"><div class="search-bar"><input id="searchUser" placeholder="搜索用户名/角色名"><button onclick="loadUsers()">搜索</button></div><div class="table-wrap" id="userList">加载中...</div></div>`;
  loadUsers();
}
async function loadUsers(){
  const kw=document.getElementById('searchUser').value;
  document.getElementById('userList').innerHTML='加载中...';
  const saves=await api('saves',{query:'select=username,data,updated_at'});
  if(!Array.isArray(saves)||!saves.length){document.getElementById('userList').innerHTML='<div class="err">暂无用户数据</div>';return;}
  let list=saves.map(r=>{
    const d=parseData(r.data);const ch=d.char||{};
    return {username:r.username,charId:ch.charId||'-',name:ch.name||r.username,level:ch.level||1,vip:ch.vip||0,gold:ch.gold||0,yuanbao:ch.yuanbao||0,jifen:ch.jifen||0,created:r.updated_at||''};
  });
  list.sort((a,b)=>new Date(b.created)-new Date(a.created));
  if(kw)list=list.filter(u=>u.username.includes(kw)||u.name.includes(kw));
  document.getElementById('userList').innerHTML='<table><tr><th>用户ID</th><th>用户昵称</th><th>等级</th><th>特权等级</th><th>贵宾</th><th>金珠</th><th>元宝</th><th>注册时间</th><th>赞助积分</th><th>操作</th></tr>'+
    list.map(u=>{const dt=new Date(u.created);const dtStr=isNaN(dt)?u.created.substring(0,16):dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');return `<tr><td>${u.charId}</td><td>${u.name}</td><td>${u.level}</td><td><span class="tag ${u.vip>0?'tag-vip':''}">${u.vip}级</span></td><td>${u.vip>0?'<span class="tag tag-vip">贵宾</span>':'-'}</td><td>${u.gold}</td><td>${u.yuanbao}</td><td>${dtStr}</td><td><b>${u.jifen}</b></td><td><button class="btn btn-primary" onclick="openPoints('${u.username}')">加积分</button><button class="btn btn-danger">封存</button></td></tr>`;}).join('')+'</table>';
}
function openPoints(uname){
  document.getElementById('modalMask').style.display='flex';
  document.getElementById('modalBox').innerHTML=`<h3>给 ${uname} 加赞助积分</h3>
    <div style="font-size:13px;color:#666;margin:10px 0 2px">积分数</div>
    <input type="number" id="pointNum" placeholder="输入积分数" value="100">
    <div style="font-size:13px;color:#666;margin:10px 0 2px">原因备注（选填，会写入赞助记录）</div>
    <input type="text" id="pointReason" placeholder="如：充值100元" value="充值">
    <div class="modal-footer"><button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="addPoints('${uname}')">提交</button></div>`;
}
function closeModal(){document.getElementById('modalMask').style.display='none';}
async function addPoints(uname){
  const num=parseInt(document.getElementById('pointNum').value)||0;
  if(num<=0){adminTip('请输入正数积分');return;}
  const reason=(document.getElementById('pointReason')||{}).value?(document.getElementById('pointReason').value.trim()||'充值'):'充值';
  const enc=encodeURIComponent(uname);
  const r=await api('saves',{query:`username=eq.${enc}&select=data`});
  if(!r||!r.length){adminTip('用户不存在：'+uname);return;}
  let d=parseData(r[0].data);
  if(!d.char)d.char={};
  d.char.jifen=(d.char.jifen||0)+num;
  // 写回的时候转成JSON字符串，和游戏端保持一致
  await api('saves',{query:`username=eq.${enc}`,method:'PATCH',body:{data:JSON.stringify(d)}});
  // 写入赞助记录
  await api('sponsor_logs',{method:'POST',body:{username:uname,jifen_delta:num,reason:reason,operator:CURRENT_ADMIN}});
  closeModal();
  // 清除saves相关缓存
  Object.keys(_cache).forEach(k=>{if(k.indexOf('saves')===0)delete _cache[k];});
  loadUsers();
  adminTip('已为 '+uname+' 加 '+num+' 积分，已记录');
}

// 顶部白底黑字提示（不用原生alert）
function adminTip(msg){
  let t=document.getElementById('adminTip');
  if(!t){
    t=document.createElement('div');
    t.id='adminTip';
    t.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:9999;font-size:14px;max-width:90vw;text-align:center;display:none';
    document.body.appendChild(t);
  }
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.style.display='none';},2500);
}

// ===== 赞助记录页 =====
function renderSponsor(c){
  c.innerHTML=`<div class="card"><div class="search-bar">
    <input id="sponsorSearch" placeholder="按账号筛选（留空看全部）" onkeydown="if(event.key==='Enter')loadSponsorLogs()">
    <button onclick="loadSponsorLogs()">筛选</button>
    <button onclick="document.getElementById('sponsorSearch').value='';loadSponsorLogs()">全部</button>
    </div><div class="table-wrap" id="sponsorList">加载中...</div></div>`;
  loadSponsorLogs();
}
async function loadSponsorLogs(){
  const input=document.getElementById('sponsorSearch');
  const kw=input&&input.value?input.value.trim():'';
  const box=document.getElementById('sponsorList');
  box.innerHTML='加载中...';
  let q='select=*&order=created_at.desc&limit=500';
  if(kw)q+=`&username=eq.${encodeURIComponent(kw)}`;
  const logs=await api('sponsor_logs',{query:q,noCache:true});
  if(!Array.isArray(logs)){box.innerHTML='<div class="err">查询失败，请重试</div>';return;}
  if(!logs.length){box.innerHTML='<div class="err">'+(kw?('账号 "'+kw+'" 暂无赞助记录'):'暂无赞助记录')+'</div>';return;}
  function fmtTime(s){
    const dt=new Date(s);
    if(isNaN(dt))return (s||'').substring(0,16);
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
  }
  box.innerHTML='<table><tr><th>赠送时间</th><th>账号</th><th>积分变动</th><th>原因</th><th>操作人</th></tr>'+
    logs.map(function(l){
      const delta=l.jifen_delta||0;
      const color=delta>0?'#52c41a':(delta<0?'#ff4d4f':'#666');
      const sign=delta>0?'+':'';
      return `<tr><td>${fmtTime(l.created_at)}</td><td>${l.username}</td><td style="color:${color};font-weight:bold">${sign}${delta}</td><td>${l.reason||'-'}</td><td>${l.operator||'-'}</td></tr>`;
    }).join('')+'</table>';
}

/* ===== 活动管理（云端表 admin_activities，游戏运行时合并 ACTIVITY_LIST） ===== */
async function renderActivities(c){
  c.innerHTML=`<div class="card"><div style="margin-bottom:12px"><button class="btn btn-primary" onclick="editAct()">新增活动</button> <span style="color:#999;font-size:12px">游戏端 ACTIVITY_LIST 会与云端此表合并（enabled=false 的条目在游戏中隐藏）</span></div><div class="table-wrap" id="actList">加载中...</div></div>`;
  const acts=await api('admin_activities',{query:'select=*&order=act_id.asc',noCache:true});
  if(!Array.isArray(acts)||!acts.length){document.getElementById('actList').innerHTML='<div class="err">暂无活动配置（可新增）</div>';return;}
  document.getElementById('actList').innerHTML='<table><tr><th>ID</th><th>活动标识</th><th>活动名称</th><th>说明</th><th>视图</th><th>启用</th><th>操作</th></tr>'+
    acts.map(a=>`<tr><td>${a.id}</td><td>${a.act_id}</td><td>${a.name}</td><td>${(a.desc||'').substring(0,40)}</td><td>${a.view||'-'}</td><td>${a.enabled===false?'<span class="tag" style="background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e">停用</span>':'<span class="tag tag-on">启用</span>'}</td><td><button class="btn btn-primary" onclick="editAct(${a.id})">编辑</button><button class="btn btn-danger" onclick="delAct(${a.id})">删除</button></td></tr>`).join('')+'</table>';
}
function editAct(id){
  const src=id?null:{act_id:'',name:'',desc:'',view:'',enabled:true};
  document.getElementById('modalMask').style.display='flex';
  const box=document.getElementById('modalBox');
  if(id){
    box.innerHTML=`<h3>编辑活动</h3><div id="actEditForm">加载中...</div>`;
    api('admin_activities',{query:`id=eq.${id}&select=*`,noCache:true}).then(rows=>{
      const a=Array.isArray(rows)&&rows.length?rows[0]:{act_id:'',name:'',desc:'',view:'',enabled:true};
      document.getElementById('actEditForm').innerHTML=actFormHtml(a,id);
    });
  }else{
    box.innerHTML=`<h3>新增活动</h3>`+actFormHtml(src,null);
  }
}
function actFormHtml(a,id){
  return `<input id="aActId" placeholder="活动标识(act_id)，如 egg/flip/signin/regGift/luckyshop" value="${a.act_id||''}">
    <input id="aName" placeholder="活动名称" value="${a.name||''}">
    <input id="aDesc" placeholder="活动说明(desc)" value="${a.desc||''}">
    <input id="aView" placeholder="游戏视图(view)" value="${a.view||''}">
    <label style="font-size:13px;color:#666"><input type="checkbox" id="aEnabled" ${a.enabled!==false?'checked':''}> 启用</label>
    <div class="modal-footer"><button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAct(${id!=null?id:'null'})">保存</button></div>`;
}
async function saveAct(id){
  const body={act_id:document.getElementById('aActId').value.trim(),name:document.getElementById('aName').value.trim(),desc:document.getElementById('aDesc').value.trim(),view:document.getElementById('aView').value.trim(),enabled:document.getElementById('aEnabled').checked};
  if(!body.act_id||!body.name){adminTip('请填写活动标识与名称');return;}
  if(id){await api(`admin_activities?id=eq.${id}`,{method:'PATCH',body,noCache:true});}
  else{await api('admin_activities',{method:'POST',body,noCache:true});}
  closeModal();renderActivities(document.getElementById('content'));
}
async function delAct(id){if(!confirm('确定删除该活动配置？'))return;await api(`admin_activities?id=eq.${id}`,{method:'DELETE',noCache:true});renderActivities(document.getElementById('content'));}

async function renderAnnounce(c){
  c.innerHTML=`<div class="card"><div style="margin-bottom:12px"><button class="btn btn-primary" onclick="editAnn(0)">新增公告</button></div><div id="annList">加载中...</div></div>`;
  loadAnns();
}
async function loadAnns(){
  const anns=await api('announcements?select=*&order=created_at.desc').catch(()=>[]);
  document.getElementById('annList').innerHTML='<table><tr><th>ID</th><th>标题</th><th>内容</th><th>时间</th><th>操作</th></tr>'+anns.map(a=>`<tr><td>${a.id}</td><td>${a.title}</td><td>${(a.content||'').substring(0,50)}</td><td>${(a.created_at||'').substring(0,16)}</td><td><button class="btn btn-primary" onclick="editAnn(${a.id})">编辑</button><button class="btn btn-danger" onclick="delAnn(${a.id})">删除</button></td></tr>`).join('')||'<tr><td colspan="5">暂无公告</td></tr></table>';
}
function editAnn(id){
  document.getElementById('modalMask').style.display='flex';
  document.getElementById('modalBox').innerHTML=`<h3>${id?'编辑':'新增'}公告</h3><input id="aTitle" placeholder="公告标题"><textarea id="aContent" rows="4" placeholder="公告内容"></textarea><div class="modal-footer"><button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAnn(${id})">保存</button></div>`;
}
async function saveAnn(id){
  const title=document.getElementById('aTitle').value,content=document.getElementById('aContent').value;
  if(id){await api(`announcements?id=eq.${id}`,{method:'PATCH',body:{title,content}});}else{await api('announcements',{method:'POST',body:{title,content}});}
  closeModal();loadAnns();
}
function delAnn(id){if(confirm('确定删除？')){api(`announcements?id=eq.${id}`,{method:'DELETE'});loadAnns();}}

async function renderChat(c){
  c.innerHTML=`<div class="card"><h3>公共频道消息</h3><div id="chatList">加载中...</div></div>`;
  const msgs=await api('chat?select=*&order=created_at.desc&limit=100').catch(()=>[]);
  document.getElementById('chatList').innerHTML=msgs.map(m=>`<div style="padding:8px;border-bottom:1px solid #eee"><b style="color:#136ec2">${m.name}</b>: ${m.content} <span style="color:#999;font-size:12px">${(m.created_at||'').substring(0,16)}</span></div>`).join('')||'暂无消息';
}

function escTextarea(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function saveEquip(id){
  const quals=Array.from(document.querySelectorAll('.eQual:checked')).map(x=>x.value);
  const srcBossLines=document.getElementById('eSourceBoss').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const source_bosses=srcBossLines.map(line=>{
    const m=line.match(/^(\S+)\s+([\d.]+)%?$/);
    return m?{bid:m[1],rate:parseFloat(m[2])}:{bid:line,rate:0.3};
  });
  const obj={
    slot:document.getElementById('eSlot').value,
    name:document.getElementById('eName').value.trim(),
    lvl:parseInt(document.getElementById('eLvl').value)||1,
    quality:quals.length?quals:['普通'],
    atk:parseInt(document.getElementById('eAtk').value)||0,
    def:parseInt(document.getElementById('eDef').value)||0,
    hp:parseInt(document.getElementById('eHp').value)||0,
    mp:parseInt(document.getElementById('eMp').value)||0,
    crit:parseFloat(document.getElementById('eCrit').value)||0,
    dodge:parseFloat(document.getElementById('eDodge').value)||0,
    star3:document.getElementById('eStar3').checked,
    price:parseInt(document.getElementById('ePrice').value)||100,
    source_bosses:source_bosses,
    source_flip:document.getElementById('eSourceFlip').checked,
    source_egg:document.getElementById('eSourceEgg').checked,
    enabled:document.getElementById('eEnabled').checked,
  };
  if(!obj.name){adminTip('请输入装备名');return;}
  if(id){await api(`admin_equips?id=eq.${id}`,{method:'PATCH',body:obj,noCache:true});}
  else{await api('admin_equips',{method:'POST',body:obj,noCache:true});}
  closeModal();loadEquips();
}
async function delEquip(id){if(!confirm('确定删除该装备配置？'))return;await api(`admin_equips?id=eq.${id}`,{method:'DELETE',noCache:true});loadEquips();}

  let list=Array.isArray(rows)?rows:[];
  if(_bossCat!=='all')list=list.filter(b=>bossCat(b)===_bossCat);
  if(!list.length){document.getElementById('bossList').innerHTML='<div class="err">该分类暂无BOSS</div>';return;}
  document.getElementById('bossList').innerHTML='<table><tr><th>标识</th><th>BOSS名</th><th>等级</th><th>血量</th><th>攻击</th><th>防御</th><th>经验</th><th>银两</th><th>地图</th><th>共享</th><th>复活(秒)</th><th>掉落</th><th>启用</th><th>操作</th></tr>'+
    list.map(b=>`<tr><td>${b.bid}</td><td>${b.name}</td><td>${b.lvl}</td><td>${(b.hp||0).toLocaleString()}</td><td>${b.atk}</td><td>${b.def}</td><td>${b.exp}</td><td>${b.silver}</td><td>${b.map}</td><td>${b.shared?'<span class="tag tag-on">共享</span>':'-'}</td><td>${b.respawn||0}</td><td>${(Array.isArray(b.drop)?b.drop:[]).length}</td><td>${b.enabled===false?'<span class="tag" style="background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e">停用</span>':'<span class="tag tag-on">启用</span>'}</td><td><button class="btn btn-primary" onclick="editBoss(${b.id})">编辑</button><button class="btn btn-danger" onclick="delBoss(${b.id})">删除</button></td></tr>`).join('')+'</table>';
}
async function editBoss(id){
  let b={bid:'',name:'',lvl:60,hp:100000,atk:1000,def:500,exp:10000,silver:5000,map:'',respawn:3600,shared:false,drop:[],enabled:true};
  if(id){const rows=await api('admin_bosses',{query:`id=eq.${id}&select=*`,noCache:true});if(Array.isArray(rows)&&rows.length)b=rows[0];}
  document.getElementById('modalMask').style.display='flex';
  const dropTxt=JSON.stringify(Array.isArray(b.drop)?b.drop:[],null,1);
  document.getElementById('modalBox').innerHTML=`<h3>${id?'编辑':'新增'}BOSS</h3>
    <input id="bBid" placeholder="BOSS标识(bid)，需唯一" value="${escTextarea(b.bid)}">
    <input id="bName" placeholder="BOSS名（含【圣兽】【灵兽】【兽王】【活】自动分类）" value="${escTextarea(b.name)}">
    <input id="bLvl" type="number" placeholder="等级" value="${b.lvl||60}">
    <input id="bHp" type="number" placeholder="血量" value="${b.hp||100000}">
    <input id="bAtk" type="number" placeholder="攻击" value="${b.atk||1000}">
    <input id="bDef" type="number" placeholder="防御" value="${b.def||500}">
    <input id="bExp" type="number" placeholder="经验" value="${b.exp||10000}">
    <input id="bSilver" type="number" placeholder="银两" value="${b.silver||5000}">
    <input id="bMap" placeholder="地图(与游戏 MAPS 节点名对应)" value="${escTextarea(b.map)}">
    <input id="bRespawn" type="number" placeholder="复活冷却(秒)" value="${b.respawn||3600}">
    <label style="font-size:13px;color:#666"><input type="checkbox" id="bShared" ${b.shared?'checked':''}> 全服共享BOSS</label>
    <div style="font-size:13px;color:#666;margin:6px 0 2px">掉落配置(JSON数组：[{"name":"装备名","type":"weapon","job":"warrior","level":60,"rate":0.3}])</div>
    <textarea id="bDrop" rows="4">${escTextarea(dropTxt)}</textarea>
    <label style="font-size:13px;color:#666"><input type="checkbox" id="bEnabled" ${b.enabled!==false?'checked':''}> 启用</label>
    <div class="modal-footer"><button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBoss(${id!=null?id:'null'})">保存</button></div>`;
}
async function saveBoss(id){
  let drop=[];
  try{drop=JSON.parse(document.getElementById('bDrop').value)||[];}catch(e){adminTip('掉落配置不是合法JSON');return;}
  if(!Array.isArray(drop)){adminTip('掉落配置需为数组');return;}
  const body={bid:document.getElementById('bBid').value.trim(),name:document.getElementById('bName').value.trim(),lvl:parseInt(document.getElementById('bLvl').value)||60,hp:parseInt(document.getElementById('bHp').value)||0,atk:parseInt(document.getElementById('bAtk').value)||0,def:parseInt(document.getElementById('bDef').value)||0,exp:parseInt(document.getElementById('bExp').value)||0,silver:parseInt(document.getElementById('bSilver').value)||0,map:document.getElementById('bMap').value.trim(),respawn:parseInt(document.getElementById('bRespawn').value)||3600,shared:document.getElementById('bShared').checked,drop:drop,enabled:document.getElementById('bEnabled').checked};
  if(!body.bid||!body.name){adminTip('请填写BOSS标识与名称');return;}
  if(id){await api(`admin_bosses?id=eq.${id}`,{method:'PATCH',body,noCache:true});}
  else{await api('admin_bosses',{method:'POST',body,noCache:true});}
  closeModal();loadBosses();
}
async function delBoss(id){if(!confirm('确定删除该BOSS配置？'))return;await api(`admin_bosses?id=eq.${id}`,{method:'DELETE',noCache:true});loadBosses();}

/* ===== 权限管理（admin_accounts + 五模块菜单权限） ===== */
async function renderPerm(c){
  c.innerHTML=`<div class="card"><div style="margin-bottom:12px"><button class="btn btn-primary" onclick="editPerm()">新增管理员</button> <span style="color:#999;font-size:12px">菜单权限位：装备/礼包/BOSS/权限/活动；无权限账号登录后仅显示有权限的菜单；超管拥有全部权限</span></div><div class="table-wrap" id="permList">加载中...</div></div>`;
  const rows=await api('admin_accounts',{query:'select=*&order=id.asc',noCache:true});
  if(!Array.isArray(rows)||!rows.length){document.getElementById('permList').innerHTML='<div class="err">暂无管理员账号</div>';return;}
  document.getElementById('permList').innerHTML='<table><tr><th>ID</th><th>账号</th><th>密码</th><th>类型</th><th>装备</th><th>礼包</th><th>BOSS</th><th>权限</th><th>活动</th><th>创建时间</th><th>操作</th></tr>'+
    rows.map(a=>{
      const pm=Object.assign({},DEFAULT_PERMS,parseData(a.perms));
      const tag=v=>v?'<span class="tag tag-on">有</span>':'<span class="tag" style="background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e">无</span>';
      return `<tr><td>${a.id}</td><td>${a.username}</td><td>******</td><td>${a.is_super?'<span class="tag tag-vip">超管</span>':'<span class="tag">普通</span>'}</td><td>${tag(pm.equip)}</td><td>${tag(pm.gift)}</td><td>${tag(pm.boss)}</td><td>${tag(pm.perm)}</td><td>${tag(pm.activity)}</td><td>${(a.created_at||'').substring(0,16)}</td><td><button class="btn btn-primary" onclick="editPerm(${a.id})">编辑</button><button class="btn btn-danger" onclick="delPerm(${a.id},'${a.username}')">删除</button></td></tr>`;}).join('')+'</table>';
}
function editPerm(id){
  document.getElementById('modalMask').style.display='flex';
  const box=document.getElementById('modalBox');
  if(id){
    box.innerHTML=`<h3>编辑管理员</h3><div id="permEditForm">加载中...</div>`;
    api('admin_accounts',{query:`id=eq.${id}&select=*`,noCache:true}).then(rows=>{
      const a=Array.isArray(rows)&&rows.length?rows[0]:{username:'',is_super:false,perms:{}};
      document.getElementById('permEditForm').innerHTML=permFormHtml(a,id);
    });
  }else{
    box.innerHTML=`<h3>新增管理员</h3>`+permFormHtml({username:'',is_super:false,perms:{}},null);
  }
}
function permFormHtml(a,id){
  const pm=Object.assign({},DEFAULT_PERMS,parseData(a.perms));
  const cb=(k,label)=>`<label style="margin-right:12px;font-size:13px"><input type="checkbox" id="p${k}" ${pm[k]?'checked':''}> ${label}</label>`;
  return `<input id="pUser" placeholder="账号" value="${escTextarea(a.username)}" ${id?'disabled':''}>
    <input id="pPass" type="password" placeholder="${id?'新密码（留空则不修改）':'密码'}">
    <label style="font-size:13px;color:#666"><input type="checkbox" id="pSuper" ${a.is_super?'checked':''}> 超级管理员（拥有全部菜单权限）</label>
    <div style="font-size:13px;color:#666;margin:8px 0 2px">五模块菜单权限</div>
    <div>${cb('equip','装备')}${cb('gift','礼包')}${cb('boss','BOSS')}${cb('perm','权限')}${cb('activity','活动')}</div>
    <div class="modal-footer"><button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="savePerm(${id!=null?id:'null'})">保存</button></div>`;
}
async function savePerm(id){
  const username=document.getElementById('pUser').value.trim();
  const password=document.getElementById('pPass').value;
  const is_super=document.getElementById('pSuper').checked;
  const perms={equip:document.getElementById('pequip').checked,gift:document.getElementById('pgift').checked,boss:document.getElementById('pboss').checked,perm:document.getElementById('pperm').checked,activity:document.getElementById('pactivity').checked};
  if(!username){adminTip('请输入账号');return;}
  const body={username:username,is_super:is_super,perms:perms};
  if(password)body.password=password;
  if(id){
    if(is_super)body.perms={equip:true,gift:true,boss:true,perm:true,activity:true};
    await api(`admin_accounts?id=eq.${id}`,{method:'PATCH',body,noCache:true});
  }else{
    if(!password){adminTip('请输入初始密码');return;}
    body.password=password;
    if(is_super)body.perms={equip:true,gift:true,boss:true,perm:true,activity:true};
    await api('admin_accounts',{method:'POST',body,noCache:true});
  }
  closeModal();renderPerm(document.getElementById('content'));
}
async function delPerm(id,username){
  if(username===CURRENT_ADMIN){adminTip('不能删除当前登录账号');return;}
  if(!confirm('确定删除管理员 '+username+' ？'))return;
  await api(`admin_accounts?id=eq.${id}`,{method:'DELETE',noCache:true});
  renderPerm(document.getElementById('content'));
}

/* ===== 种子初始化：表空时自动写入基础数据 ===== */
async function ensureAdminSeeds(){
  try{
    let menus=await api('admin_menus',{query:'select=*&limit=100',noCache:true});
    if(Array.isArray(menus)&&!menus.length){
      const defMenus=[['dashboard','仪表盘','',1],['users','用户管理','',2],['sponsor','赞助记录','',3],['items','道具管理','',4],['equip','装备管理','equip',5],['gift','礼包管理','gift',6],['boss','BOSS管理','boss',7],['perm','权限管理','perm',8],['activities','活动管理','activity',9],['announce','公告管理','',10],['chat','聊天监控','',11]];
      for(const m of defMenus)await api('admin_menus',{method:'POST',body:{menu_key:m[0],name:m[1],perm_key:m[2],sort:m[3]},noCache:true});
    }
    let acts=await api('admin_activities',{query:'select=*&limit=100',noCache:true});
    if(Array.isArray(acts)&&!acts.length){
      const defActs=[['egg','快乐砸蛋','每次砸蛋消耗10元宝','egg'],['flip','幸运翻牌','翻牌有几率额外获得三国币','flip'],['signin','签到好礼','每日签到领好礼','signin'],['regGift','注册领好礼','新玩家注册好礼','regGift'],['luckyshop','三国币兑换','三国币兑奖商店','luckyshop']];
      for(const a of defActs)await api('admin_activities',{method:'POST',body:{act_id:a[0],name:a[1],desc:a[2],view:a[3]},noCache:true});
    }
    let gifts=await api('admin_gifts',{query:'select=*&limit=100',noCache:true});
    if(Array.isArray(gifts)&&!gifts.length){
      await api('admin_gifts',{method:'POST',body:{kind:'vip_daily',name:'每日贵宾礼包',desc:'每日贵宾可领取，打开获得丰厚奖励',rewards:[{name:'元宝',kind:'yuanbao',num:288},{name:'[活]砸蛋锤',kind:'eggToken',num:1},{name:'[活]翻牌令',kind:'flipToken',num:1},{name:'大魔石',kind:'dms',num:1},{name:'大血石',kind:'dxs',num:1}],p:0,enabled:true},noCache:true});
    }
    let eqs=await api('admin_equips',{query:'select=*&limit=100',noCache:true});
    if(Array.isArray(eqs)&&!eqs.length){
      for(const e of DEFAULT_EQUIPS){
        await api('admin_equips',{method:'POST',body:{slot:e.slot,name:e.name,lvl:e.lvl,quality:['普通'],atk:e.atk,def:e.def,hp:e.hp,mp:0,crit:0,dodge:0,star3:false,price:e.price,source_bosses:[],source_flip:false,source_egg:false,enabled:true},noCache:true});
      }
    }
    let bosses=await api('admin_bosses',{query:'select=*&limit=100',noCache:true});
    if(Array.isArray(bosses)&&!bosses.length){
      for(const b of DEFAULT_BOSSES){
        await api('admin_bosses',{method:'POST',body:b,noCache:true});
      }
    }
  }catch(e){console.error('种子初始化失败',e);}
}
